name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$TAG" = "$FILE" ] || {
            echo "tag $TAG != VERSION $FILE"; exit 1; }
      - name: Build and test
        run: |
          swift build -c release
          ./test.sh
      - name: Package app
        run: |
          cp Resources/AppIcon.icns .build/release/
          ./scripts/make-app-bundle.sh .build/release "$RUNNER_TEMP/AgentDeck.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/AgentDeck.app" \
            "$RUNNER_TEMP/AgentDeck-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/AgentDeck-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --notes "$NOTES"
